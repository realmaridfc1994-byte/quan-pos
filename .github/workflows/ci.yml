name: CI

on:
  push:
  pull_request:

jobs:
  kiem-tra:
    runs-on: ubuntu-latest

    # Engine phải KHỚP máy dev và máy quán: MariaDB, không phải MySQL 8. CI chạy
    # trên engine khác nơi code thật sự chạy thì màu xanh không chứng minh gì —
    # hai engine ĐÃ có khác biệt thật (cảnh báo #1906 khi ghi đè cột tự tính:
    # MySQL từ chối cả câu lệnh, MariaDB âm thầm bỏ giá trị sai).
    services:
      mariadb:
        image: mariadb:10.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: yes
          # Tên database phải khớp DB_DATABASE trong phpunit.xml, không phải
          # `quan_pos` — bộ test chạy trên database riêng.
          MARIADB_DATABASE: quan_pos_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: quan_pos_test
      DB_USERNAME: root
      DB_PASSWORD: ""
      DB_CHARSET: utf8mb4
      DB_COLLATION: utf8mb4_unicode_ci

    steps:
      - name: Lấy code
        uses: actions/checkout@v4

      - name: Cài PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, bcmath, pdo_mysql, intl
          coverage: none

      - name: Cài thư viện PHP
        run: composer install --no-interaction --prefer-dist

      - name: Chuẩn bị .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Kiểm tra format code (Pint)
        run: ./vendor/bin/pint --test

      - name: Phân tích tĩnh (Larastan)
        run: ./vendor/bin/phpstan analyse

      - name: Chạy toàn bộ test (Pest)
        run: ./vendor/bin/pest
